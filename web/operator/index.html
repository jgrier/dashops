<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DashOps · Operator</title>
  <style>
    :root {
      --bg:        #0e1116;
      --surface:   #161b22;
      --surface-2: #1f262e;
      --border:    #2a3038;
      --fg:        #e6edf3;
      --fg-muted:  #9ba6b3;
      --accent:    #f55b35;
      --user-bg:   #1f3a5f;
      --assistant-bg: #1f262e;
      --tool-bg:   #1a2a1f;
      --tool-fg:   #9bd5a8;
      --system-bg: #3a1f1f;
      --system-fg: #ffb0a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header .badge {
      font-size: 11px;
      padding: 3px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--fg-muted);
    }
    header .status {
      font-size: 12px;
      color: var(--fg-muted);
    }
    header .status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      margin-right: 6px;
      vertical-align: 1px;
    }
    header .status.idle .dot     { background: #555; }
    header .status.thinking .dot,
    header .status.calling_tool .dot { background: #ffcc4d; animation: pulse 1.4s infinite; }
    header .status.complete .dot { background: #4dd478; }
    header .status.failed .dot   { background: #f55b35; }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 720px;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user      { background: var(--user-bg); align-self: flex-end; }
    .msg.assistant { background: var(--assistant-bg); border: 1px solid var(--border); }
    .msg.tool {
      background: var(--tool-bg);
      color: var(--tool-fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
    }
    .msg.system    { background: var(--system-bg); color: var(--system-fg); font-size: 13px; }
    .msg .role {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-muted);
      margin-bottom: 4px;
    }
    .msg .cost {
      display: inline-block;
      margin-left: 10px;
      font-size: 11px;
      color: var(--fg-muted);
    }
    .msg .tool-result {
      margin-top: 6px;
      max-height: 280px;
      overflow: auto;
      font-size: 12px;
      padding: 8px;
      background: rgba(0,0,0,0.25);
      border-radius: 4px;
    }
    .msg .tool-collapse summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .msg .tool-collapse summary::-webkit-details-marker { display: none; }
    .msg .tool-collapse summary::before {
      content: "▸";
      color: var(--fg-muted);
      font-size: 11px;
      transition: transform 0.15s;
      display: inline-block;
    }
    .msg .tool-collapse[open] summary::before { content: "▾"; }
    .msg .tool-collapse summary .role { margin-bottom: 0; }
    .msg .tool-collapse summary .content-preview {
      color: var(--fg-muted);
      font-size: 12px;
    }
    footer {
      padding: 12px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    form {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--surface-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .seed-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .seed-chip {
      font-size: 11px;
      padding: 4px 10px;
      background: var(--surface-2);
      color: var(--fg-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
    }
    .seed-chip:hover { color: var(--fg); border-color: #4a525c; }
    #tabs {
      display: flex;
      gap: 4px;
      padding: 8px 20px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      color: var(--fg-muted);
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }
    .tab:hover { color: var(--fg); }
    .tab.active {
      color: var(--fg);
      background: var(--bg);
      border-color: var(--border);
      position: relative;
      top: 1px;                       /* sit flush with the bottom border */
    }
    .tab .tab-glyph { font-size: 11px; }
    .tab.s-thinking .tab-glyph,
    .tab.s-calling_tool .tab-glyph { color: #ffcc4d; }
    .tab.s-needs_approval .tab-glyph,
    .tab.s-appeal_pending .tab-glyph { color: #ffd28e; }
    .tab.s-blocked_appealable .tab-glyph { color: #ffb0a0; }
    .tab.s-complete .tab-glyph { color: #4dd478; }
    .tab.s-failed .tab-glyph { color: #f55b35; }
    .tab .tab-close {
      color: var(--fg-muted);
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      margin-left: 2px;
      border-radius: 3px;
    }
    .tab .tab-close:hover { background: rgba(255,255,255,0.08); color: var(--fg); }
    .tab.tab-add {
      color: var(--fg-muted);
      font-size: 14px;
      padding: 4px 10px;
    }
    .tab.tab-add:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>DashOps</h1>
    <span class="badge">operator</span>
    <nav style="display:flex;gap:14px;margin-left:12px;font-size:12px;">
      <a href="/operator"  style="color:#f55b35;text-decoration:none;font-weight:600;">operator</a>
      <a href="/approver"  style="color:#9ba6b3;text-decoration:none;">approver</a>
      <a href="/services"  style="color:#9ba6b3;text-decoration:none;">services</a>
    </nav>
    <span class="status idle" id="status" style="margin-left:auto"><span class="dot"></span><span id="status-text">idle</span></span>
  </header>

  <div id="tabs"></div>

  <div id="pending-banner" style="display:none; padding:10px 20px; background:#3a2a05; color:#ffd28e; font-size:13px; border-bottom:1px solid #4a3a15;">
    <strong>⏸ Waiting on approval</strong> from <span id="pending-group"></span>: <span id="pending-summary"></span>
  </div>

  <div id="appeal-banner" style="display:none; padding:10px 20px; background:#3a1f1f; color:#ffb0a0; font-size:13px; border-bottom:1px solid #4a2828; display:flex; align-items:center; gap:12px;">
    <div style="flex:1">
      <strong>⚠ Blocked by <span id="appeal-source"></span>:</strong> <span id="appeal-reason"></span>
    </div>
    <button id="appeal-btn" style="background:#f55b35;color:#fff;border:0;border-radius:4px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;">
      Request review from <span id="appeal-group"></span>
    </button>
  </div>

  <main id="messages"></main>

  <footer>
    <form id="input-form">
      <input id="input" type="text" placeholder="What's going on with delivery #12345?" autocomplete="off" autofocus />
      <button type="submit">Send</button>
    </form>
    <div class="seed-chips">
      <span class="seed-chip" data-seed="What happened with delivery #12345?">What happened with delivery #12345?</span>
      <span class="seed-chip" data-seed="Apologize and credit $20 to the customer of delivery #12345">Apologize + $20 credit (delivery #12345)</span>
      <span class="seed-chip" data-seed="Apologize and credit $5 to the customer of delivery #12346">Apologize + $5 (no approval needed)</span>
      <span class="seed-chip" data-seed="find similar complaints about cold food">Find similar complaints</span>
      <span class="seed-chip" data-seed="find similar complaints from customer at 555-867-5309">Find complaints (PII)</span>
      <span class="seed-chip" data-seed="check merchants for deliveries 12345, 12346, 12399, 12345, 12346, 12399, 12345">Merchant batch (rate-limit)</span>
    </div>
  </footer>

  <script src="/operator/app.js"></script>
</body>
</html>
