<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DashOps · Approver</title>
  <style>
    :root {
      --bg:        #0e1116;
      --surface:   #161b22;
      --surface-2: #1f262e;
      --border:    #2a3038;
      --fg:        #e6edf3;
      --fg-muted:  #9ba6b3;
      --accent:    #4dd478;
      --danger:    #f55b35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    header .badge {
      font-size: 11px;
      padding: 3px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--fg-muted);
    }
    header select {
      margin-left: auto;
      background: var(--surface-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 13px;
    }
    main {
      padding: 20px;
      max-width: 760px;
      margin: 0 auto;
    }
    .empty {
      text-align: center;
      color: var(--fg-muted);
      font-size: 14px;
      padding: 60px 20px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      margin-top: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }
    .card.appeal {
      border-color: #f55b35;
      background: linear-gradient(180deg, #2a1612 0%, var(--surface) 100%);
    }
    .kind-chip {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .appeal-chip {
      background: #f55b35;
      color: #fff;
    }
    .card .meta {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--fg-muted);
      margin-bottom: 8px;
    }
    .card .summary {
      font-size: 15px;
      line-height: 1.4;
      margin: 4px 0 14px 0;
    }
    .card .tool-chip {
      font-size: 10px;
      padding: 2px 8px;
      background: var(--surface-2);
      border-radius: 10px;
      color: var(--fg-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .input {
      flex: 1;
      background: var(--surface-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.approve { background: var(--accent); color: #0e1116; }
    button.reject  { background: var(--danger); color: #fff; }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--fg);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
    /* Shared top nav — must stay pixel-identical with operator/index.html,
       web.ts (portal), and serve-ops-view.ts so navigating between
       surfaces feels static. */
    .topnav {
      background: #0e0e0e;
      padding: 10px 24px;
      border-bottom: 1px solid #2a3038;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }
    .topnav a { color: #9ba6b3; text-decoration: none; }
    .topnav a:hover { color: #f55b35; }
    .topnav a.active { color: #f55b35; font-weight: 600; }
    /* Approver-group tabs (replaces the old <select>). Mirrors the
       operator UI's session-tab look for consistency. */
    #group-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 20px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .group-tab {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      background: transparent;
      color: var(--fg-muted);
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .group-tab:hover { color: var(--fg); }
    .group-tab.active {
      color: var(--fg);
      background: var(--bg);
      border-color: var(--border);
      position: relative;
      top: 1px;
    }
    .group-tab .count {
      display: inline-block;
      min-width: 18px;
      text-align: center;
      padding: 1px 6px;
      border-radius: 9px;
      font-size: 11px;
      background: rgba(255,255,255,0.06);
      color: var(--fg-muted);
    }
    .group-tab.active .count { background: var(--accent); color: #fff; }
    .group-tab .count.zero { opacity: 0.5; }
    /* Pending / Decided sub-tabs inside the active group. */
    #subtabs {
      display: flex;
      gap: 16px;
      padding: 12px 20px 4px;
      font-size: 12px;
    }
    .subtab {
      background: none;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      padding: 2px 0;
      border-bottom: 2px solid transparent;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .subtab:hover { color: var(--fg); }
    .subtab.active { color: var(--fg); border-bottom-color: var(--accent); }
    /* History rows: lighter than active cards. */
    .history-row {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .history-row:hover { background: rgba(255,255,255,0.02); }
    .history-row .outcome {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .history-row .outcome.approved  { background: #1f3a1f; color: #9ce19c; }
    .history-row .outcome.rejected  { background: #3a1f1f; color: #ffb0a0; }
    .history-row .outcome.cancelled { background: #2a2a2a; color: var(--fg-muted); }
    .history-row .when { color: var(--fg-muted); font-family: ui-monospace, monospace; }
    .history-row .who  { color: var(--fg-muted); font-size: 11px; }
    .history-row .comment { color: var(--fg-muted); font-size: 11px; font-style: italic; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="topnav">
    <a href="/operator">operator</a>
    <a href="/approver" class="active">approver</a>
    <a href="/services">services</a>
    <a href="http://localhost:3001/">supervisor</a>
  </div>
  <header>
    <h1>DashOps</h1>
    <span class="badge">approver</span>
    <span class="badge" id="user-badge">user: -</span>
  </header>

  <div id="group-tabs"></div>
  <div id="subtabs">
    <button class="subtab active" data-view="pending">Pending</button>
    <button class="subtab" data-view="history">Decided</button>
  </div>

  <main id="content"></main>

  <div class="toast" id="toast"></div>

  <script src="/approver/app.js"></script>
</body>
</html>
