<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="extGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="restateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f2937"/>
      <stop offset="50%"  stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="sessionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="toolsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="guardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="approvalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f472b6"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" rx="12" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="600">DashOps on Restate</text>
  <text x="600" y="54" text-anchor="middle" fill="#94a3b8" font-size="13">Operator agent · agent gateway · async HITL approval — every hop durable.</text>

  <!-- =========== Row 1: External UIs =========== -->
  <text x="280" y="92" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1.5">USERS</text>

  <rect x="280" y="100" width="240" height="60" rx="8" fill="url(#extGrad)" filter="url(#shadow)"/>
  <text x="400" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="600">Operator UI</text>
  <text x="400" y="144" text-anchor="middle" fill="#cbd5e1" font-size="11">chat · session resume · pending banner</text>

  <rect x="680" y="100" width="240" height="60" rx="8" fill="url(#extGrad)" filter="url(#shadow)"/>
  <text x="800" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="600">Approver UI</text>
  <text x="800" y="144" text-anchor="middle" fill="#cbd5e1" font-size="11">approval cards · group dropdown · SSE</text>

  <!-- arrows from UIs to bridge -->
  <line x1="400" y1="160" x2="400" y2="195" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="160" x2="800" y2="195" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =========== Row 2: Web bridge =========== -->
  <rect x="200" y="200" width="800" height="56" rx="8" fill="url(#bridgeGrad)" filter="url(#shadow)"/>
  <text x="600" y="222" text-anchor="middle" fill="white" font-size="13" font-weight="600">Ops-agent web bridge (HTTP/SSE proxy on :3000)</text>
  <text x="600" y="240" text-anchor="middle" fill="#cbd5e1" font-size="11">/api/sessions/* &#8594; Session VO &#160; · &#160; /api/approvals/* &#8594; ApprovalService &amp; PendingApprovalsIndex</text>

  <!-- arrow bridge → restate -->
  <line x1="600" y1="256" x2="600" y2="294" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="278" fill="#fbbf24" font-size="11">Restate ingress :8080</text>

  <!-- =========== Row 3: Restate runtime band =========== -->
  <rect x="80" y="300" width="1040" height="80" rx="10" fill="url(#restateGrad)" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="328" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700" letter-spacing="0.8">RESTATE RUNTIME</text>
  <text x="600" y="350" text-anchor="middle" fill="#cbd5e1" font-size="12">durable invocations &#160;·&#160; journal &amp; replay &#160;·&#160; awakeables &#160;·&#160; per-key state &#160;·&#160; pause/resume</text>
  <text x="600" y="367" text-anchor="middle" fill="#94a3b8" font-size="11">admin UI :9070 &#160;·&#160; ingress :8080</text>

  <!-- arrows from runtime to each service -->
  <line x1="180" y1="380" x2="180" y2="430" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <line x1="395" y1="380" x2="395" y2="430" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <line x1="600" y1="380" x2="600" y2="430" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <line x1="805" y1="380" x2="805" y2="430" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <line x1="1020" y1="380" x2="1020" y2="430" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGrey)"/>

  <!-- =========== Row 4: Five service groups =========== -->
  <!-- 1. Session VO -->
  <rect x="100" y="430" width="160" height="100" rx="8" fill="url(#sessionGrad)" filter="url(#shadow)"/>
  <text x="180" y="455" text-anchor="middle" fill="white" font-size="13" font-weight="600">Session</text>
  <text x="180" y="473" text-anchor="middle" fill="#dbeafe" font-size="10">VO per session_id</text>
  <text x="180" y="497" text-anchor="middle" fill="#f1f5f9" font-size="10">chat state</text>
  <text x="180" y="511" text-anchor="middle" fill="#f1f5f9" font-size="10">reagent loop</text>
  <text x="180" y="525" text-anchor="middle" fill="#f1f5f9" font-size="10">awakeable suspend</text>

  <!-- 2. Gateway service + helper VOs -->
  <rect x="315" y="430" width="160" height="100" rx="8" fill="url(#gatewayGrad)" filter="url(#shadow)"/>
  <text x="395" y="455" text-anchor="middle" fill="white" font-size="13" font-weight="600">Gateway</text>
  <text x="395" y="473" text-anchor="middle" fill="#fef3c7" font-size="10">service + child VOs</text>
  <text x="395" y="497" text-anchor="middle" fill="#fef3c7" font-size="10">ToolRegistry</text>
  <text x="395" y="511" text-anchor="middle" fill="#fef3c7" font-size="10">CostLedger</text>
  <text x="395" y="525" text-anchor="middle" fill="#fef3c7" font-size="10">TokenBucket</text>

  <!-- 3. Tools (7) -->
  <rect x="520" y="430" width="160" height="100" rx="8" fill="url(#toolsGrad)" filter="url(#shadow)"/>
  <text x="600" y="455" text-anchor="middle" fill="white" font-size="13" font-weight="600">Tools (7)</text>
  <text x="600" y="473" text-anchor="middle" fill="#ede9fe" font-size="10">Restate services</text>
  <text x="600" y="491" text-anchor="middle" fill="#f1f5f9" font-size="9">delivery_lookup · customer_lookup</text>
  <text x="600" y="503" text-anchor="middle" fill="#f1f5f9" font-size="9">escalation_history · semantic_search</text>
  <text x="600" y="515" text-anchor="middle" fill="#f1f5f9" font-size="9">apply_credit · customer_outreach</text>
  <text x="600" y="527" text-anchor="middle" fill="#f1f5f9" font-size="9">merchant_status</text>

  <!-- 4. Guardrails -->
  <rect x="725" y="430" width="160" height="100" rx="8" fill="url(#guardGrad)" filter="url(#shadow)"/>
  <text x="805" y="455" text-anchor="middle" fill="white" font-size="13" font-weight="600">Guardrails</text>
  <text x="805" y="473" text-anchor="middle" fill="#d1fae5" font-size="10">middleware</text>
  <text x="805" y="497" text-anchor="middle" fill="#f1f5f9" font-size="10">PIIGuardrail</text>
  <text x="805" y="511" text-anchor="middle" fill="#f1f5f9" font-size="10">regex pre-screen</text>
  <text x="805" y="525" text-anchor="middle" fill="#f1f5f9" font-size="10">(LLM-upgrade ready)</text>

  <!-- 5. Approval service -->
  <rect x="940" y="430" width="160" height="100" rx="8" fill="url(#approvalGrad)" filter="url(#shadow)"/>
  <text x="1020" y="455" text-anchor="middle" fill="white" font-size="13" font-weight="600">Approval-service</text>
  <text x="1020" y="473" text-anchor="middle" fill="#fce7f3" font-size="10">HITL lifecycle</text>
  <text x="1020" y="497" text-anchor="middle" fill="#f1f5f9" font-size="10">ApprovalService VO</text>
  <text x="1020" y="511" text-anchor="middle" fill="#f1f5f9" font-size="10">PendingApprovalsIndex</text>
  <text x="1020" y="525" text-anchor="middle" fill="#f1f5f9" font-size="10">awakeable resolves</text>

  <!-- key relationships between services (curved arrows under the runtime, semantic links) -->
  <!-- Session → Gateway (every tool call) -->
  <path d="M 260 530 Q 290 560 315 540" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arrowCyan)"/>
  <!-- Gateway → Tools -->
  <path d="M 475 530 Q 500 560 520 540" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arrowCyan)"/>
  <!-- Gateway → Guardrails (pipeline step) -->
  <path d="M 475 510 Q 600 580 725 510" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowCyan)"/>
  <!-- Session → Approval (register approval, await awakeable) -->
  <path d="M 260 460 Q 600 410 940 460" fill="none" stroke="#f472b6" stroke-width="1.7" marker-end="url(#arrowPink)"/>
  <text x="600" y="412" text-anchor="middle" fill="#f472b6" font-size="11" font-style="italic">awakeable suspend / resolve (hours · days · weeks)</text>

  <!-- =========== Row 5: Gateway pipeline detail =========== -->
  <rect x="80" y="575" width="1040" height="120" rx="10" fill="url(#pipeGrad)" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="603" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">Gateway pipeline — every agent ↔ tool call passes through these steps in order</text>

  <!-- pipeline steps as chevrons -->
  <g font-size="11" font-weight="600" fill="white">
    <!-- step 1: registry -->
    <rect x="105" y="625" width="130" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="170" y="649" text-anchor="middle">1 · registry</text>
    <text x="170" y="666" text-anchor="middle" fill="#cbd5e1" font-size="9">look up tool</text>

    <!-- step 2: guardrail -->
    <rect x="246" y="625" width="130" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="311" y="649" text-anchor="middle">2 · guardrail</text>
    <text x="311" y="666" text-anchor="middle" fill="#cbd5e1" font-size="9">PII check</text>

    <!-- step 3: policy -->
    <rect x="387" y="625" width="130" height="50" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="452" y="649" text-anchor="middle">3 · policy</text>
    <text x="452" y="666" text-anchor="middle" fill="#cbd5e1" font-size="9">needs approval?</text>

    <!-- step 4: rate limit -->
    <rect x="528" y="625" width="130" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="593" y="649" text-anchor="middle">4 · rate limit</text>
    <text x="593" y="666" text-anchor="middle" fill="#cbd5e1" font-size="9">token buckets ×3</text>

    <!-- step 5: identity -->
    <rect x="669" y="625" width="130" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="734" y="649" text-anchor="middle">5 · identity</text>
    <text x="734" y="666" text-anchor="middle" fill="#cbd5e1" font-size="9">inject caller ctx</text>

    <!-- step 6: dispatch -->
    <rect x="810" y="625" width="130" height="50" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="875" y="649" text-anchor="middle">6 · dispatch</text>
    <text x="875" y="666" text-anchor="middle" fill="#cbd5e1" font-size="9">call downstream</text>

    <!-- step 7: cost -->
    <rect x="951" y="625" width="130" height="50" rx="6" fill="#1e293b" stroke="#0d9488" stroke-width="1.5"/>
    <text x="1016" y="649" text-anchor="middle">7 · cost</text>
    <text x="1016" y="666" text-anchor="middle" fill="#cbd5e1" font-size="9">record to ledger</text>
  </g>

  <!-- arrows between pipeline steps -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="235" y1="650" x2="246" y2="650" marker-end="url(#arrowGrey)"/>
    <line x1="376" y1="650" x2="387" y2="650" marker-end="url(#arrowGrey)"/>
    <line x1="517" y1="650" x2="528" y2="650" marker-end="url(#arrowGrey)"/>
    <line x1="658" y1="650" x2="669" y2="650" marker-end="url(#arrowGrey)"/>
    <line x1="799" y1="650" x2="810" y2="650" marker-end="url(#arrowGrey)"/>
    <line x1="940" y1="650" x2="951" y2="650" marker-end="url(#arrowGrey)"/>
  </g>

  <!-- bottom legend -->
  <text x="600" y="722" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">All services are Restate handlers — every step above is journaled and observable in the admin UI.</text>
  <text x="600" y="740" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">Rate-limit waits are durable `ctx.sleep`; approvals are durable awakeables. Nothing held in memory between events.</text>
</svg>
